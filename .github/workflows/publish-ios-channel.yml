# Publishes the signed agent channel manifest the meshDeck app follows:
# `ios-agent-<MAJOR>.json` + `.minisig` on the `channel` branch, one file per
# image major. The app verifies the signature against the minisign roster
# embedded in it, refuses a stale or reused serial, and only ever moves to a
# stable release in its compiled major at or above its compiled pin; on any
# failure it keeps the compiled pin. Design: the app repo's
# docs/AGENT_CHANNEL.md. Manual only:
#
#   gh workflow run publish-ios-channel -f version=1.0.2
#
# The version must be a published release of this repository: its image tag
# on GHCR is resolved to the index digest that the manifest names, so the
# fleet pulls content, not a tag.
name: publish-ios-channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable agent version the fleet should pin (bare X.Y.Z, e.g. 1.0.2)"
        required: true
      key:
        description: "Which roster key signs: primary (MINISIGN_KEY) or emergency (MINISIGN_KEY2, the rotation key)"
        type: choice
        options: [primary, emergency]
        default: primary

permissions:
  contents: write
  packages: read # pull the image signature for the cosign cross-check

# One publish at a time: two runs racing on the channel branch could push a
# duplicate serial or fail non-fast-forward.
concurrency:
  group: publish-ios-channel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/ag-studio-apps/stackguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the version is a stable release of this repository
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version '$VERSION' is not a bare stable X.Y.Z"; exit 1; }
          TAG_SHA="$(git rev-list -n1 "refs/tags/v$VERSION" 2>/dev/null || true)"
          [ -n "$TAG_SHA" ] || { echo "::error::tag v$VERSION does not exist"; exit 1; }
          git merge-base --is-ancestor "$TAG_SHA" origin/main || {
            echo "::error::tag v$VERSION is not on main's ancestry"; exit 1; }
          MAJOR="${VERSION%%.*}"
          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "CHANNEL=ios-agent-$MAJOR" >> "$GITHUB_ENV"
          echo "ASSET=ios-agent-$MAJOR.json" >> "$GITHUB_ENV"

      - name: Resolve the image tag to its index digest
        run: |
          set -euo pipefail
          TOKEN="$(curl -sf "https://ghcr.io/token?scope=repository:ag-studio-apps/stackguard:pull" | jq -r .token)"
          DIGEST="$(curl -sfI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/ag-studio-apps/stackguard/manifests/$VERSION" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $IMAGE:$VERSION ('$DIGEST')"; exit 1; }
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "digest: $DIGEST"

      # The channel manifest must name only a digest this repository's own
      # publish.yml signed. Without this, a digest resolved from the mutable
      # tag would be trusted on the tag alone; here it must carry the keyless
      # cosign signature whose certificate identity is a workflow in this repo
      # (the same signature the README tells users to verify). A poisoned tag,
      # even behind a registry-write compromise, has no such signature and the
      # publish stops.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify the image's cosign signature
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/AG-Studio-Apps/stackguard/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "cosign: $IMAGE@$DIGEST is signed by this repository"

      - name: Compute the serial
        run: |
          set -euo pipefail
          # The serial is the publish time in seconds: monotonic without any
          # state, so a recreated branch or a lost file can never restart
          # numbering below what devices already hold (which would freeze
          # them on the channel for good). A previous manifest that somehow
          # carries a higher serial (a skewed clock, a hand-pushed file) is
          # climbed past by one rather than becoming a ceiling nothing can
          # publish under. The branch is fetched once, here, for every step.
          NOW="$(date -u +%s)"
          SERIAL="$NOW"
          CHANNEL_EXISTS=0
          if git ls-remote --exit-code --heads origin channel >/dev/null 2>&1; then
            CHANNEL_EXISTS=1
            git fetch --quiet origin channel
            if git cat-file -e "origin/channel:$ASSET" 2>/dev/null; then
              PREV="$(git show "origin/channel:$ASSET" | jq -r '.serial // empty' || true)"
              [[ "$PREV" =~ ^[0-9]+$ ]] || { echo "::error::previous $ASSET serial unreadable ('$PREV')"; exit 1; }
              if [ "$PREV" -ge "$NOW" ]; then
                SERIAL=$((PREV + 1))
                echo "::warning::previous serial $PREV is not below the clock ($NOW); using $SERIAL"
              fi
            fi
          fi
          echo "SERIAL=$SERIAL" >> "$GITHUB_ENV"
          echo "CHANNEL_EXISTS=$CHANNEL_EXISTS" >> "$GITHUB_ENV"
          echo "serial: $SERIAL"

      - name: Write and sign the manifest
        env:
          KEY_ROLE: ${{ inputs.key }}
          PRIMARY_KEY: ${{ secrets.MINISIGN_KEY }}
          PRIMARY_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          EMERGENCY_KEY: ${{ secrets.MINISIGN_KEY2 }}
          EMERGENCY_PASSWORD: ${{ secrets.MINISIGN_PASSWORD2 }}
        run: |
          set -euo pipefail
          # The pair is chosen here, in bash, so an empty emergency secret is
          # an error rather than a silent fall-back to the key being rotated.
          case "$KEY_ROLE" in
            primary) MINISIGN_KEY="$PRIMARY_KEY"; MINISIGN_PASSWORD="$PRIMARY_PASSWORD" ;;
            emergency) MINISIGN_KEY="$EMERGENCY_KEY"; MINISIGN_PASSWORD="$EMERGENCY_PASSWORD" ;;
            *) echo "::error::unknown key role '$KEY_ROLE'"; exit 1 ;;
          esac
          [ -n "$MINISIGN_KEY" ] && [ -n "$MINISIGN_PASSWORD" ] || {
            echo "::error::the $KEY_ROLE key or its passphrase secret is missing"; exit 1; }
          echo "signing with the $KEY_ROLE key"
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          mkdir -p /tmp/out
          printf '{"schema":1,"serial":%d,"version":"%s","digest":"%s"}\n' "$SERIAL" "$VERSION" "$DIGEST" > "/tmp/out/$ASSET"
          jq . "/tmp/out/$ASSET"
          echo "$MINISIGN_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
          # The trusted comment binds the signature to this manifest's semantics,
          # channel included. Bash twin of AgentChannel.expectedTrustedComment
          # in the app; drift here freezes the channel (fail-safe, but a footgun).
          echo "$MINISIGN_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -t "stackguard $CHANNEL serial $SERIAL version $VERSION digest $DIGEST" \
            -m "/tmp/out/$ASSET"
          rm /tmp/minisign.key
          # The signature must verify against the roster this repository
          # publishes (the one the app embeds): a secret that drifted from it
          # would publish a manifest every device rejects, silently.
          minisign -V -q -p "keys/$KEY_ROLE.pub" -m "/tmp/out/$ASSET" || {
            echo "::error::the manifest does not verify against keys/$KEY_ROLE.pub; the secret is not this roster"; exit 1; }
          echo "verified against keys/$KEY_ROLE.pub"

      - name: Commit to the channel branch
        run: |
          set -euo pipefail
          git config user.name "publish-ios-channel"
          git config user.email "actions@github.com"
          if [ "$CHANNEL_EXISTS" -eq 1 ]; then
            git checkout --quiet -B channel origin/channel
          else
            git checkout --quiet --orphan channel
            git rm -rfq --cached . && git clean -fdxq -e /tmp/out
            printf '# stackGuard agent channel\n\nSigned manifests read by the meshDeck app. Written only by the publish-ios-channel workflow.\n' > README.md
          fi
          cp "/tmp/out/$ASSET" "/tmp/out/$ASSET.minisig" .
          git add README.md "$ASSET" "$ASSET.minisig"
          git commit -q -m "$CHANNEL serial $SERIAL: $VERSION ($DIGEST)"
          git push -q origin channel
          {
            echo "## Agent channel published"
            echo "- channel: \`$ASSET\`"
            echo "- version: \`$VERSION\`"
            echo "- digest: \`$DIGEST\`"
            echo "- serial: \`$SERIAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
